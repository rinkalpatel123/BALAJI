<section class="join-update-form section-padding py-5">
  <div class="container">
    <div class="row">
      <div class="col-sm-12">
        <div class="section-title">
          <div class="lotus">
            <img src="./assets/img/lotus.png" alt="">
          </div>
          <h2>Join for Updates </h2>
          <img class="position-set" src="./assets/img/about/bg.png" style="position: absolute;
               top: 0px; right: 100px; width: 400px;">
        </div>
      </div>
    </div>
    <div class="row justify-content-center">
      <div class="col-md-8">
        <form class="bg-light border p-4 rounded">
          <div class="row">
            <div class="col-md-6">
              <div class="mb-3">
                <label for="exampleInputFname" class="form-label">First Name</label>
                <input type="email" class="form-control" id="exampleInputFname" aria-describedby="emailHelp">
              </div>
            </div>
            <div class="col-md-6">
              <div class="mb-3">
                <label for="exampleInputLname" class="form-label">Last Name</label>
                <input type="email" class="form-control" id="exampleInputLname" aria-describedby="emailHelp">
              </div>
            </div>
            <div class="col-md-6">
              <div class="mb-3">
                <label for="exampleInputEmail1" class="form-label">Email address</label>
                <input type="email" class="form-control" id="exampleInputEmail1" aria-describedby="emailHelp">
              </div>
            </div>
            <div class="col-md-6">
              <div class="mb-3">
                <label for="exampleInputNumber" class="form-label">Phone Number</label>
                <input type="text" class="form-control" id="exampleInputNumber">
              </div>
            </div>
            <div class="col-md-6">
              <div class="mb-3">
                <label for="exampleInputConnect" class="form-label">How would you like us to contact you?*</label>

                <div class="form-check">
                  <input class="form-check-input" type="checkbox" value="" id="checkDefault">
                  <label class="form-check-label fw-normal" for="checkDefault">
                    Email
                  </label>
                </div>

                <div class="form-check">
                  <input class="form-check-input" type="checkbox" value="" id="checkDefault">
                  <label class="form-check-label fw-normal" for="checkDefault">
                    Call
                  </label>
                </div>

                <div class="form-check">
                  <input class="form-check-input" type="checkbox" value="" id="checkDefault">
                  <label class="form-check-label fw-normal" for="checkDefault">
                    WhatsApp
                  </label>
                </div>
              </div>
            </div>
            <div class="col-md-6">
              <div class="mb-3 form-check">
                <input type="checkbox" class="form-check-input" id="exampleCheck1">
                <label class="form-check-label" for="exampleCheck1">WhatsApp number is same as my phone number</label>
              </div>
            </div>
          </div>

          <div class="w-100 text-center">
            <button type="submit" class="btn btn-primary">Submit</button>
          </div>
        </form>
      </div>
    </div>
  </div>
</section>
